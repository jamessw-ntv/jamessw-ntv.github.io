<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Azeroth Character Sheet</title>
<link rel="stylesheet" href="../assets/hub.css" />
<style>
  .hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin:18px 0}
  .avatar{font-size:60px;line-height:1;width:96px;height:96px;display:grid;place-items:center;
    background:var(--panel2);border:2px solid var(--red);border-radius:50%;box-shadow:var(--shadow-hover)}
  .hero h2{margin:0;font-size:26px}
  .hero .who{color:var(--muted);font-size:14px;margin:2px 0 10px}
  .hero .who b{color:var(--text)}
  .synced{font-size:12px;color:var(--muted);margin-top:8px}

  .bar{height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .8s ease}
  .bar.gold > i{background:var(--yellow)} .bar.purple > i{background:var(--purple)}
  .bar.green > i{background:var(--green)} .bar.red > i{background:var(--red)}
  .lvl{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin:4px 0 0}
  .lvl b{color:var(--text)}

  h3.sec{margin:28px 0 10px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  h3.sec .src{letter-spacing:0;text-transform:none;font-weight:400;font-size:12px;margin-left:6px}
  .tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center}
  .tile .k{font-size:12px;letter-spacing:.15em;color:var(--muted)}
  .tile .v{font-size:24px;font-weight:700;line-height:1.2}
  .tile .n{font-size:12px;color:var(--muted)}
  .tile.gold .v{color:var(--yellow)}

  .rows{display:grid;gap:10px}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
  .row .top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:6px}
  .row .top span:last-child{color:var(--muted);white-space:nowrap}
  .eta{font-size:12px;color:var(--muted);margin-top:6px}
  .eta b{color:var(--text)}

  ul.list{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  ul.list li{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;
    display:flex;gap:10px;align-items:center;font-size:14px}
  ul.list li .ic{font-size:22px}
  ul.list li small{display:block;color:var(--muted);font-size:12px}
  ul.list li.locked{opacity:.4}

  table.roster{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  table.roster th,table.roster td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  table.roster th{color:var(--muted);font-weight:500;font-size:12px;background:var(--panel2)}
  table.roster td.num{text-align:right;font-variant-numeric:tabular-nums}
  .scroll{overflow-x:auto}
  .fact{font-size:14px}
  .fact b{color:var(--yellow)}
  @media (max-width:520px){ .hero{grid-template-columns:1fr;text-align:center} .avatar{margin:0 auto} }
</style>
</head>
<body>
<div class="hubbar">
  <a class="backlink" href="../">← Hub</a>
  <span class="crumb"><b>Azeroth Character Sheet</b></span>
</div>

<header class="page">
  <div class="wrap" style="padding-bottom:0">
    <h1>Azeroth Character Sheet</h1>
    <div class="sub">World of Warcraft stats, synced from the addon save files on the PC. Each sync adds a snapshot, so the "at this rate" dates get sharper over time.</div>
  </div>
</header>

<div class="wrap" id="app"><p class="sub" style="margin-top:20px">Summoning…</p></div>

<footer class="site">Part of the <a href="../">projects hub</a>.</footer>

<script>
const RAW = "https://raw.githubusercontent.com/jamessw-ntv/jamessw-ntv.github.io/main/character/wow.json";
async function loadWow(){
  const bust = "?_=" + Date.now();
  for(const url of [RAW + bust, "wow.json" + bust]){
    try{ const r = await fetch(url,{cache:"no-store"}); if(r.ok) return await r.json(); }catch(e){}
  }
  return null;
}

/* ---------- helpers ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (n,d=0) => n==null || isNaN(n) ? "—" : Number(n).toLocaleString(undefined,{maximumFractionDigits:d});
const pct = (v,max) => Math.max(0, Math.min(100, max ? v/max*100 : 0));
const bar = (cls,v,max) => `<div class="bar ${cls}"><i style="width:0" data-w="${pct(v,max)}"></i></div>`;
const DAY = 86400000;
const dateIn = days => new Date(Date.now()+days*DAY).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
const ago = iso => { if(!iso) return "—"; const m = Math.round((Date.now()-new Date(iso))/60000);
  return m<60 ? m+" min ago" : m<1440 ? Math.round(m/60)+" h ago" : Math.round(m/1440)+" days ago"; };
const CLASS_ICON = { Paladin:"🛡️", Warrior:"⚔️", Druid:"🐻", Shaman:"⚡", Mage:"🔮", Priest:"✨", Rogue:"🗡️",
  Hunter:"🏹", Warlock:"👹", "Death Knight":"💀", Monk:"🥋", "Demon Hunter":"🦇", Evoker:"🐉" };

/* Next round milestone above a value: 539 → 550, 783 → 800, 32,210 → 35,000. */
function nextMilestone(v){
  if(!v) return 10;
  const step = Math.max(10, 5 * Math.pow(10, Math.floor(Math.log10(v)) - 1));
  return Math.floor(v/step)*step + step;
}
/* Rate per day for one stat, from the oldest to the newest snapshot. */
function ratePerDay(history, key){
  const pts = (history||[]).filter(h => h[key]!=null);
  if(pts.length < 2) return null;
  const a = pts[0], b = pts[pts.length-1];
  const days = (new Date(b.date) - new Date(a.date)) / DAY;
  return days > 0 ? (b[key]-a[key]) / days : null;
}
function etaLine(history, key, value, goal, unit){
  const r = ratePerDay(history, key);
  if(r == null) return `Need two syncs on different days to work out your pace.`;
  if(r <= 0) return `No change since ${esc(history[0].date)}, so no ETA yet.`;
  return `+${fmt(r*7, r*7<10?1:0)}${unit||""} a week → <b>${fmt(goal)}${unit||""}</b> around <b>${dateIn((goal-value)/r)}</b>`;
}

function render(w){
  const chars = [...(w.characters||[])].sort((a,b) => (b.level||0)-(a.level||0) || (b.playedHours||0)-(a.playedHours||0));
  const main = chars[0] || {};
  const col = w.collections || {};
  const hist = w.history || [];
  const gold = chars.reduce((n,c) => n + (c.gold||0), 0);
  const hours = chars.reduce((n,c) => n + (c.playedHours||0), 0);
  const html = [];

  /* Hero: the main */
  html.push(`<div class="hero">
    <div class="avatar">${CLASS_ICON[main.class] || "🧝"}</div>
    <div>
      <h2>${esc(main.name)} <span style="color:var(--muted);font-weight:400">of ${esc(main.realm||"")}</span></h2>
      <div class="who">Level <b>${fmt(main.level)}</b> ${esc(main.race||"")} ${esc(main.class||"")} · ${esc(main.faction||"")} · ${esc(main.flavour||"")}</div>
      ${main.maxLevel ? `${bar("red", main.level, main.maxLevel)}<div class="lvl"><span>Level <b>${fmt(main.level)}</b> / ${fmt(main.maxLevel)}</span>
        <span>${main.level >= main.maxLevel ? "<b>Max level</b>" : `${main.maxLevel-main.level} levels to go`}</span></div>` : ""}
      <div class="synced">Last synced ${ago(w.synced)} · main last seen ${esc(main.lastSeen||"—")}</div>
    </div>
  </div>`);

  /* Headline numbers */
  const animals = (col.mounts||0) + (col.pets||0);
  html.push(`<div class="tiles">
    <div class="tile gold"><div class="k">GOLD</div><div class="v">${fmt(gold)}g</div><div class="n">all characters</div></div>
    <div class="tile"><div class="k">TIME PLAYED</div><div class="v">${fmt(hours/24)} days</div><div class="n">${fmt(hours)} hours</div></div>
    <div class="tile"><div class="k">ANIMALS</div><div class="v">${fmt(animals)}</div><div class="n">mounts + pets</div></div>
    <div class="tile"><div class="k">ACHIEVEMENT PTS</div><div class="v">${fmt(col.achievementPoints)}</div><div class="n">${fmt(col.achievements)} earned</div></div>
    <div class="tile"><div class="k">CHARACTERS</div><div class="v">${chars.length}</div><div class="n">with saved stats</div></div>
  </div>`);

  /* Collections with next milestone + pace */
  const COLL = [
    ["🐎","Mounts","mounts"], ["🐾","Battle pets (species)","pets"], ["🧸","Toys","toys"],
    ["🏆","Achievement points","achievementPoints"], ["📜","Titles","titles"], ["🗝️","Heirlooms","heirlooms"],
    ["👘","Transmog appearances","appearances"],
  ].filter(([,,k]) => col[k] != null);
  html.push(`<h3 class="sec">Collections <span class="src">· ${esc(col.flavour||"")} account, at this rate</span></h3><div class="rows">` +
    COLL.map(([ic,name,k]) => { const v = col[k], goal = nextMilestone(v); return `
      <div class="row"><div class="top"><span>${ic} ${esc(name)}</span><span>${fmt(v)} / ${fmt(goal)}</span></div>
        ${bar("purple", v, goal)}<div class="eta">${etaLine(hist, k, v, goal)}</div></div>`; }).join("") + `</div>`);

  /* Wealth */
  const goldGoal = gold < 1e6 ? 1e6 : nextMilestone(gold);
  html.push(`<h3 class="sec">Treasury</h3><div class="rows">
    <div class="row"><div class="top"><span>💰 Total gold</span><span>${fmt(gold)}g / ${fmt(goldGoal)}g</span></div>
      ${bar("gold", gold, goldGoal)}<div class="eta">${etaLine(hist, "gold", gold, goldGoal, "g")}</div></div>` +
    chars.filter(c => c.gold).map(c => `<div class="row"><div class="top"><span>${esc(c.name)} <span class="sub">${esc(c.flavour)}</span></span><span>${fmt(c.gold, c.gold<10?2:0)}g</span></div>${bar("gold", c.gold, gold)}</div>`).join("") +
  `</div>`);

  /* Time played, with some perspective */
  const workYears = hours / 1760;   // a full-time work year is about 1,760 hours
  html.push(`<h3 class="sec">Time in Azeroth</h3><div class="rows">
    <div class="row fact">⏳ <b>${fmt(hours)}</b> hours on record: <b>${fmt(hours/24)}</b> days straight, or about <b>${fmt(workYears,1)}</b> full-time work years.</div>
    <div class="row"><div class="top"><span>Time played</span><span>pace</span></div>
      <div class="eta">${etaLine(hist, "playedHours", hours, Math.ceil(hours/500)*500, " h")}</div></div>
  </div>`);

  /* Roster */
  html.push(`<h3 class="sec">Roster</h3><div class="scroll"><table class="roster"><thead><tr>
      <th>Character</th><th>Version</th><th>Race / class</th><th>Level</th><th>Gold</th><th>Played</th><th>Last seen</th></tr></thead><tbody>` +
    chars.map(c => `<tr><td>${CLASS_ICON[c.class]||""} <b>${esc(c.name)}</b> <span class="sub">${esc(c.realm||"")}</span></td><td>${esc(c.flavour||"")}</td>
      <td>${esc([c.race,c.class].filter(Boolean).join(" "))}</td><td class="num">${fmt(c.level)}</td>
      <td class="num">${c.gold==null ? "—" : fmt(c.gold, c.gold<10?2:0)+"g"}</td><td>${esc(c.played||"—")}</td><td>${esc(c.lastSeen||"—")}</td></tr>`).join("") +
    `</tbody></table></div>`);

  /* Feats: unlock from the synced numbers */
  const feats = [
    ["👑","Max Level",        "Reach the level cap on any character",          chars.some(c => c.maxLevel && c.level >= c.maxLevel)],
    ["🐎","Stable Master",    "Collect 500 mounts",                             (col.mounts||0) >= 500],
    ["🦄","Herd of Legends",  "Collect 750 mounts",                             (col.mounts||0) >= 750],
    ["🐾","Menagerie",        "Collect 750 pet species",                        (col.pets||0) >= 750],
    ["🧸","Toy Box Hoarder",  "Collect 500 toys",                               (col.toys||0) >= 500],
    ["🏆","Point Lord",       "Earn 30,000 achievement points",                 (col.achievementPoints||0) >= 30000],
    ["📜","Many Names",       "Unlock 200 titles",                              (col.titles||0) >= 200],
    ["👘","Fashion Icon",     "Collect 25,000 transmog appearances",            (col.appearances||0) >= 25000],
    ["💰","Goblin Tycoon",    "Hold 100,000 gold",                              gold >= 1e5],
    ["💎","Gold Millionaire", "Hold 1,000,000 gold",                            gold >= 1e6],
    ["⏳","No-Lifer",         "Play 1 full year (8,760 hours)",                 hours >= 8760],
    ["👥","Altoholic",        "Have 10 characters with saved stats",            chars.length >= 10],
  ];
  html.push(`<h3 class="sec">Feats · ${feats.filter(f=>f[3]).length}/${feats.length}</h3><ul class="list">` +
    feats.map(([ic,nm,desc,ok]) => `<li class="${ok?"":"locked"}"><span class="ic">${ok?ic:"🔒"}</span><span>${esc(nm)}<small>${esc(desc)}</small></span></li>`).join("") + `</ul>`);

  html.push(`<p class="sub" style="margin-top:24px">${esc(w.source||"")}. ${esc(w.notes||"")} ${hist.length} snapshot${hist.length===1?"":"s"} on record.</p>`);
  document.getElementById("app").innerHTML = html.join("");
  requestAnimationFrame(()=>document.querySelectorAll(".bar > i").forEach(i=>i.style.width = i.dataset.w + "%"));
}

loadWow().then(w => w ? render(w)
  : (document.getElementById("app").innerHTML = `<p class="sub" style="margin-top:20px">Couldn't load wow.json.</p>`));
</script>
</body>
</html>
