<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Results Dashboard · Softball Umpires</title>
<link rel="icon" href="../images/wbsc-logo.svg">
<link rel="stylesheet" href="../site.css?v=20261025b">
<style>
  body { background:var(--soft); }
  .header-inner { min-height:84px; }
  .brand-logo { width:160px; }
  .admin-tag { color:var(--gold); font-size:.72rem; font-weight:900; letter-spacing:.15em; text-transform:uppercase; }
  .d-head { display:flex; justify-content:space-between; align-items:end; gap:20px; flex-wrap:wrap; margin-bottom:24px; }
  .d-actions { display:flex; gap:10px; flex-wrap:wrap; }
  .btn-navy { background:var(--navy); color:#fff; }
  .btn-navy:hover { background:var(--navy-light); }
  .btn-line { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  .btn[disabled] { opacity:.5; cursor:progress; }

  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:15px; }
  .panels { display:grid; grid-template-columns:1.3fr 1fr; gap:15px; margin-top:15px; }
  .panel { background:#fff; padding:22px; border-top:5px solid var(--gold); }
  .panel h3 { margin:0; color:var(--navy); font-size:1rem; font-weight:900; letter-spacing:.02em; }
  .panel .note { margin:4px 0 14px; color:var(--muted); font-size:.8rem; }

  .chart { position:relative; }
  .chart svg { display:block; width:100%; height:auto; overflow:visible; }
  .chart text { fill:var(--muted); font:700 13px Arial,Helvetica,sans-serif; }
  .chart .gridline { stroke:var(--line); }
  .chart .bar { fill:var(--navy); transition:fill .15s, opacity .15s; }
  .chart .bar.dim { opacity:.35; }
  .chart .hit { fill:transparent; }
  .chart .passline { stroke:var(--red); stroke-width:2; stroke-dasharray:5 4; }
  .chart .passlabel { fill:var(--red); }
  .chart .rail { fill:var(--soft); }
  .tip { position:absolute; pointer-events:none; background:var(--navy-deep); color:#fff; border-left:4px solid var(--gold);
    padding:8px 10px; font-size:.75rem; line-height:1.4; max-width:280px; transform:translate(-50%,-112%); opacity:0; transition:opacity .12s; z-index:3; }

  .records { margin-top:15px; }
  .tools { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .tools input { flex:0 1 320px; border:1px solid var(--line); padding:11px 12px; color:var(--navy); background:#fff; }
  .chips { display:flex; gap:8px; }
  .chip { padding:10px 14px; border:1px solid var(--line); background:#fff; color:var(--navy); font-size:.72rem; font-weight:900; letter-spacing:.04em; cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--gold); border-color:var(--gold); box-shadow:inset 4px 0 0 var(--red); }
  .count { color:var(--muted); font-size:.78rem; font-weight:700; }
  .tablewrap { overflow-x:auto; border:1px solid var(--line); }
  table { width:100%; border-collapse:collapse; min-width:860px; font-size:.86rem; }
  th { text-align:left; padding:12px 14px; background:var(--navy); color:#fff; font-size:.68rem; font-weight:900; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; white-space:nowrap; user-select:none; }
  th[aria-sort="ascending"]::after { content:" ↑"; color:var(--gold); } th[aria-sort="descending"]::after { content:" ↓"; color:var(--gold); }
  td { padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top; color:var(--body); background:#fff; }
  tr.row { cursor:pointer; } tr.row:hover td { background:#FAFBFD; }
  td .strong { color:var(--navy); font-weight:900; } td .sub { color:var(--muted); font-size:.76rem; margin-top:2px; }
  td.num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .pill { display:inline-block; padding:6px 10px; font-size:.66rem; font-weight:900; letter-spacing:.05em; }
  .pill.pass { background:var(--gold); color:var(--navy); } .pill.fail { background:var(--red); color:#fff; }
  .estat { font-size:.76rem; font-weight:700; color:var(--muted); } .estat.bad { color:var(--red); }
  tr.detail td { background:var(--soft); white-space:pre-line; font-size:.8rem; border-left:4px solid var(--gold); }
  .empty { padding:40px; text-align:center; color:var(--muted); }

  .login { max-width:440px; margin:70px auto; background:#fff; border-top:5px solid var(--gold); padding:32px; }
  .login .field input { padding:12px; }
  .login .btn { width:100%; margin-top:18px; }
  .err { color:var(--red); font-size:.8rem; font-weight:700; min-height:18px; margin:10px 0 0; }

  @media(max-width:900px) { .tiles { grid-template-columns:1fr 1fr; } .panels { grid-template-columns:1fr; } }
  @media(max-width:520px) { .admin-tag { display:none; } .tiles { grid-template-columns:1fr 1fr; gap:10px; } .result-card strong { font-size:1.6rem; } }
</style>
</head>
<body>
<header>
  <div class="wrap header-inner">
    <a href="../" aria-label="Back to Softball Umpires"><img class="brand-logo" src="../images/wbsc-logo.svg" alt="WBSC logo"></a>
    <nav aria-label="Admin navigation"><span class="admin-tag">Admin</span><a class="quiz-link" href="../">← BACK TO SITE</a></nav>
  </div>
</header>

<main class="section" id="app" aria-live="polite"></main>

<script src="../questions.js?v=20261025b"></script>
<script>
/* Admin dashboard: one shared password (ADMIN_PASSWORD on the Worker).
   The password is only kept for this browser tab (sessionStorage) and sent to the Worker on each request. */
const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const API = QUIZ.WORKER_URL.replace(/\/$/, "");
const BY_ID = Object.fromEntries(QUIZ.questions.map(q => [q.id, q]));
const KEY = "quizAdminPw";
let pw = null, rows = [], view = { q: "", filter: "all", sort: "submitted_at", dir: -1, open: null };
try { pw = sessionStorage.getItem(KEY); } catch (e) {}

function login(msg) {
  app.innerHTML = `
  <form class="login" id="f">
    <div class="eyebrow">Administrator</div>
    <h1 class="title" style="font-size:2rem">RESULTS DASHBOARD</h1>
    <div class="field"><label for="pw">Admin password</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus></div>
    <button class="btn btn-gold" type="submit">OPEN DASHBOARD →</button>
    <p class="err" id="err">${esc(msg || "")}</p>
  </form>`;
  document.getElementById("f").addEventListener("submit", ev => {
    ev.preventDefault(); pw = document.getElementById("pw").value; load();
  });
}

async function load() {
  try {
    const r = await fetch(API + "/results.json", { headers: { Authorization: "Bearer " + pw } });
    if (r.status === 403) { forget(); return login("That password didn't work."); }
    if (!r.ok) throw new Error("HTTP " + r.status);
    rows = (await r.json()).results || [];
    try { sessionStorage.setItem(KEY, pw); } catch (e) {}
    dashboard();
  } catch (e) {
    console.error(e);
    login("Couldn't reach the results service. Check your connection and try again.");
  }
}
function forget() { pw = null; try { sessionStorage.removeItem(KEY); } catch (e) {} }

function dashboard() {
  const n = rows.length, passes = rows.filter(r => r.result === "PASS").length;
  const avg = n ? Math.round(rows.reduce((s, r) => s + Number(r.percent || 0), 0) / n) : 0;
  const week = rows.filter(r => Date.now() - new Date(r.submitted_at) < 7 * 864e5).length;
  const people = new Set(rows.map(r => (r.email || "").toLowerCase())).size;
  app.innerHTML = `
  <div class="wrap">
    <div class="d-head">
      <div><div class="eyebrow">Recorded quizzes</div><h1 class="title">RESULTS DASHBOARD</h1></div>
      <div class="d-actions">
        <button class="btn btn-line" id="refresh" type="button">↻ REFRESH</button>
        <button class="btn btn-gold" id="csv" type="button">⬇ DOWNLOAD CSV</button>
        <button class="btn btn-navy" id="out" type="button">LOG OUT</button>
      </div>
    </div>
    <div class="tiles">
      <div class="result-card"><span>Recorded attempts</span><strong>${n}</strong><small>${people} ${people === 1 ? "umpire" : "umpires"}</small></div>
      <div class="result-card"><span>Pass rate</span><strong>${n ? Math.round(passes / n * 100) : 0}%</strong><small>${passes} passed · ${n - passes} review needed</small></div>
      <div class="result-card"><span>Average score</span><strong>${avg}%</strong><small>Pass mark ${QUIZ.passMark}%</small></div>
      <div class="result-card"><span>Last 7 days</span><strong>${week}</strong><small>attempts</small></div>
    </div>
    <div class="panels">
      <div class="panel"><h3>SCORE DISTRIBUTION</h3><p class="note">Attempts per score band. The red dashed line is the ${QUIZ.passMark}% pass mark.</p><div class="chart" id="hist"></div></div>
      <div class="panel"><h3>HARDEST QUESTIONS</h3><p class="note">Share answered correctly, lowest first. Hover for the question.</p><div class="chart" id="byq"></div></div>
    </div>
    <div class="panel records">
      <div class="tools">
        <input id="search" placeholder="Search name, email or association" value="${esc(view.q)}" aria-label="Search">
        <div class="chips" role="group" aria-label="Filter by result">
          ${[["all", "ALL"], ["PASS", "PASSED"], ["FAIL", "REVIEW NEEDED"]].map(([f, l]) => `<button type="button" class="chip" data-f="${f}" aria-pressed="${view.filter === f}">${l}</button>`).join("")}
        </div>
        <span class="count" id="shown"></span>
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th data-k="submitted_at">Submitted</th><th data-k="name">Umpire</th><th data-k="quiz">Quiz</th>
          <th data-k="percent">Score</th><th data-k="result">Result</th><th data-k="email_status">Admin email</th></tr></thead>
        <tbody id="tb"></tbody>
      </table></div>
    </div>
  </div>`;
  histogram(document.getElementById("hist"));
  hardest(document.getElementById("byq"));
  table();
  document.getElementById("search").addEventListener("input", e => { view.q = e.target.value; table(); });
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    view.filter = b.dataset.f; app.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b)); table();
  });
  app.querySelectorAll("th").forEach(th => th.onclick = () => {
    view.dir = view.sort === th.dataset.k ? -view.dir : -1; view.sort = th.dataset.k; table();
  });
  document.getElementById("refresh").onclick = load;
  document.getElementById("out").onclick = () => { forget(); login(); };
  document.getElementById("csv").onclick = downloadCsv;
}

function shortQuiz(q) { return String(q || "").split(" · ").slice(1).join(" · ") || q; }

function table() {
  const q = view.q.trim().toLowerCase();
  const list = rows.filter(r => (view.filter === "all" || r.result === view.filter) &&
    (!q || [r.name, r.email, r.association].join(" ").toLowerCase().includes(q)));
  const k = view.sort, num = k === "percent";
  list.sort((a, b) => (num ? Number(a[k]) - Number(b[k]) : String(a[k] || "").localeCompare(String(b[k] || ""))) * view.dir);
  app.querySelectorAll("th").forEach(th => th.setAttribute("aria-sort", th.dataset.k === k ? (view.dir > 0 ? "ascending" : "descending") : "none"));
  document.getElementById("shown").textContent = `${list.length} of ${rows.length} shown`;
  const tb = document.getElementById("tb");
  if (!list.length) { tb.innerHTML = `<tr><td colspan="6" class="empty">${rows.length ? "No results match." : "No recorded attempts yet."}</td></tr>`; return; }
  tb.innerHTML = list.map(r => {
    const d = new Date(r.submitted_at), sent = r.email_status === "sent";
    const detail = String(r.answers || "").split("\n").map(line => {
      const m = line.match(/^([A-Z]+\d+):/), item = m && BY_ID[m[1]];
      return item ? `${line}\n   ↳ ${item.question}` : line;
    }).join("\n");
    return `<tr class="row" data-id="${r.id}">
      <td class="num">${d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })}<div class="sub">${d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}</div></td>
      <td><div class="strong">${esc(r.name)}</div><div class="sub">${esc(r.email)}${r.association ? " · " + esc(r.association) : ""}</div></td>
      <td>${esc(shortQuiz(r.quiz))}</td>
      <td class="num"><span class="strong">${esc(r.percent)}%</span> <span class="sub" style="display:inline">${esc(r.score)}/${esc(r.total)}</span></td>
      <td><span class="pill ${r.result === "PASS" ? "pass" : "fail"}">${r.result === "PASS" ? "PASS" : "REVIEW NEEDED"}</span></td>
      <td><span class="estat ${sent ? "" : "bad"}">${sent ? "✓ Sent" : esc(r.email_status)}</span></td></tr>` +
      (view.open === r.id ? `<tr class="detail"><td colspan="6">${esc(detail)}</td></tr>` : "");
  }).join("");
  tb.querySelectorAll("tr.row").forEach(tr => tr.onclick = () => {
    const id = Number(tr.dataset.id); view.open = view.open === id ? null : id; table();
  });
}

/* Charts: one series each, so no legend; hover shows exact values. */
function histogram(el) {
  const bins = Array.from({ length: 10 }, (_, i) => ({ lo: i * 10, hi: i === 9 ? 100 : i * 10 + 9, n: 0 }));
  rows.forEach(r => bins[Math.min(9, Math.floor(Number(r.percent) / 10))].n++);
  const W = 560, H = 230, L = 34, B = 26, T = 12, max = Math.max(1, ...bins.map(b => b.n));
  const step = Math.max(1, Math.ceil(max / 4)), top = step * Math.ceil(max / step);
  const bw = (W - L) / bins.length, y = v => T + (H - T - B) * (1 - v / top);
  let svg = "";
  for (let v = 0; v <= top; v += step) svg += `<line class="gridline" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  bins.forEach((b, i) => {
    const x = L + i * bw + 1, w = bw - 2, h = y(0) - y(b.n);
    if (b.n) svg += `<path class="bar" data-i="${i}" d="${barPath(x, y(b.n), w, h)}"/>`;
    svg += `<rect class="hit" data-i="${i}" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}"/>`;
    if (i % 2 === 0) svg += `<text x="${L + i * bw}" y="${H - 8}">${b.lo}%</text>`;
  });
  svg += `<text x="${W}" y="${H - 8}" text-anchor="end">100%</text>`;
  const px = L + (W - L) * QUIZ.passMark / 100;
  svg += `<line class="passline" x1="${px}" x2="${px}" y1="${T}" y2="${y(0)}"/><text class="passlabel" x="${px - 5}" y="${T + 10}" text-anchor="end">PASS ${QUIZ.passMark}%</text>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Score distribution">${svg}</svg><div class="tip"></div>`;
  hover(el, i => `${bins[i].lo}–${bins[i].hi}%: <b>${bins[i].n}</b> ${bins[i].n === 1 ? "attempt" : "attempts"}`);
}

function hardest(el) {
  const stats = {};
  rows.forEach(r => String(r.answers || "").split("\n").forEach(line => {
    const m = line.match(/^([A-Z]+\d+):/); if (!m || !BY_ID[m[1]]) return; // skip ids no longer in the bank
    const s = stats[m[1]] || (stats[m[1]] = { id: m[1], seen: 0, right: 0 });
    s.seen++; if (!/\(wrong\)\s*$/.test(line)) s.right++;
  }));
  const list = Object.values(stats).map(s => ({ ...s, pct: Math.round(s.right / s.seen * 100) }))
    .sort((a, b) => a.pct - b.pct || b.seen - a.seen).slice(0, 8);
  if (!list.length) { el.innerHTML = `<p class="note" style="margin:30px 0;text-align:center">No answers recorded yet.</p>`; return; }
  const W = 420, rowH = 32, L = 40, R = 48, H = list.length * rowH + 4;
  let svg = "";
  list.forEach((s, i) => {
    const y = 2 + i * rowH, w = Math.max(s.pct ? 4 : 0, (W - L - R) * s.pct / 100);
    svg += `<text x="0" y="${y + 19}">${esc(s.id)}</text>
      <rect class="rail" x="${L}" y="${y + 6}" width="${W - L - R}" height="18"/>
      ${w ? `<path class="bar" data-i="${i}" d="${hbarPath(L, y + 6, w, 18)}"/>` : ""}
      <text x="${W - R + 8}" y="${y + 19}" style="fill:var(--navy)">${s.pct}%</text>
      <rect class="hit" data-i="${i}" x="0" y="${y}" width="${W}" height="${rowH}"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hardest questions">${svg}</svg><div class="tip"></div>`;
  hover(el, i => { const s = list[i], q = BY_ID[s.id];
    return `<b>${esc(s.id)}</b>${q ? " · " + esc(q.question) : ""}<br><b>${s.right}/${s.seen}</b> correct`; });
}

// Bars: rounded data-end, square baseline.
function barPath(x, y, w, h) {
  const r = Math.min(4, h, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function hbarPath(x, y, w, h) {
  const r = Math.min(4, w, h / 2);
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
}
function hover(el, label) {
  const tip = el.querySelector(".tip");
  el.querySelectorAll(".hit").forEach(h => {
    h.addEventListener("mouseenter", () => {
      el.querySelectorAll(".bar").forEach(b => b.classList.toggle("dim", b.dataset.i !== h.dataset.i));
      tip.innerHTML = label(Number(h.dataset.i)); tip.style.opacity = 1;
    });
    h.addEventListener("mousemove", ev => {
      const r = el.getBoundingClientRect();
      tip.style.left = (ev.clientX - r.left) + "px"; tip.style.top = (ev.clientY - r.top) + "px";
    });
    h.addEventListener("mouseleave", () => { tip.style.opacity = 0; el.querySelectorAll(".bar").forEach(b => b.classList.remove("dim")); });
  });
}

async function downloadCsv() {
  const btn = document.getElementById("csv"); btn.disabled = true;
  try {
    const r = await fetch(API + "/results.csv", { headers: { Authorization: "Bearer " + pw } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const url = URL.createObjectURL(await r.blob());
    const a = Object.assign(document.createElement("a"), { href: url, download: `umpire-quiz-results-${new Date().toISOString().slice(0, 10)}.csv` });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) { alert("Couldn't download the CSV: " + e.message); }
  btn.disabled = false;
}

pw ? load() : login();
</script>
</body>
</html>
